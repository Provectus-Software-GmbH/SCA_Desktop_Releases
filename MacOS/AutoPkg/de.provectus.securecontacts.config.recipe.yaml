Identifier: de.provectus.securecontacts.config
Description: Prepares Secure Contacts plist configuration profile for Intune deployment. Stages the blank production template for admin customization.
MinimumVersion: '2.3'

Input:
  NAME: SecureContacts
  DISPLAY_NAME: Secure Contacts Configuration
  DESCRIPTION: 'Configuration profile for Secure Contacts application policies.'
  BUNDLE_ID: de.provectus.SecureContactsDesktop
  OUTPUT_PATH: '%RECIPE_CACHE_DIR%'

Process:
  # Copy the production plist template to the output path
  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_DIR%/de.provectus.SecureContactsDesktop.plist'
      destination_path: '%OUTPUT_PATH%/%NAME%-config-production.plist'
      overwrite: true

  # Copy the demo plist (reference only) for admins
  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_DIR%/de.provectus.SecureContactsDesktop.plist.demo'
      destination_path: '%OUTPUT_PATH%/%NAME%-config-demo.plist'
      overwrite: true

  # Copy the manifest schema reference for non-Intune MDM platforms
  - Processor: Copier
    Arguments:
      source_path: '%RECIPE_DIR%/secure-contacts-manifest.json'
      destination_path: '%OUTPUT_PATH%/%NAME%-manifest-schema.json'
      overwrite: true

# USAGE INSTRUCTIONS
#
# This recipe stages Secure Contacts configuration files for Intune deployment.
# Unlike the application package, configuration is platform-specific:
#
# FOR MICROSOFT INTUNE (PRIMARY):
#   1. Run recipe: autopkg run de.provectus.securecontacts.config
#   2. Output location: ~/Library/AutoPkg/Cache/de.provectus.securecontacts.config/
#   3. Open SecureContacts-config-production.plist in a text editor
#   4. Fill in your production configuration values (JSON strings for complex config)
#   5. Upload the completed plist to Intune Admin Center → Devices → Configuration → Profiles
#   6. Create macOS custom profile with preference file type
#   7. Paste the completed plist content (without XML wrappers)
#   8. Assign to device group
#
# FOR NON-INTUNE MDM (JAMF, KANDJI, etc.):
#   1. Use SecureContacts-manifest-schema.json as reference for required keys
#   2. Build configuration in your MDM platform's native format
#   3. Deploy using your MDM's policy or profile mechanism
#
# REFERENCE FILES:
#   - SecureContacts-config-production.plist: Blank template for production use
#   - SecureContacts-config-demo.plist: Example values (reference only)
#   - SecureContacts-manifest-schema.json: Schema definition for all configuration keys
#
# DOCUMENTATION:
#   - See MacOS/SCA-Intune-Config-Manual-Mac.md for detailed configuration guide
#   - See https://docs.secure-contacts.com for policy definitions
#
# SECURITY NOTE:
#   - Configuration is separate from the application package
#   - Admins control all settings; app only applies what is deployed via MDM
#   - For Intune: Use managed preferences for device-level enforcement
#   - Keep unused keys empty (no defaults applied by app)
